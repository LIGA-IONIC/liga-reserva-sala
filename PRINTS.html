<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print · Reserva de Sala</title>
<link rel="stylesheet" href="prints.css">
<style>
body{background:#fff;padding:16px 12px 32px}
.exemplo{text-align:center;font-size:0.72rem;letter-spacing:0.16em;font-weight:800;color:#94a3b8;margin:0 0 12px}
.bloco h2{display:none}
.fone{box-shadow:none;border:0;border-radius:12px;min-height:0}
.tb{background:#4f46e5}
.btn.main{background:#4f46e5}
</style>
</head>
<body>
<p class="exemplo">EXEMPLO VISUAL</p>
<div class="grid">
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Reserva de Sala</span><span style="font-weight:600;font-size:0.8rem;">sair</span></div>
      <div class="pad">
        <div class="item"><div><strong>Lab 1 10:00-11:00</strong><div class="muted">livre</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Lab 1 11:00-12:00</strong><div class="muted">ocupado</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Lab 2 10:00-11:00</strong><div class="muted">livre</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Auditorio 14:00</strong><div class="muted">livre</div></div><span class="badge ok">+</span></div>
        <div class="item"><div><strong>Sala maker 15:00</strong><div class="muted">ocupado</div></div><span class="badge ok">+</span></div>
        <button class="btn main">Continuar</button>
      </div>
    </div>
  </div>
  <div class="bloco">
    <div class="fone">
      <div class="tb"><span>Reserva de Sala</span><span style="font-weight:600;font-size:0.8rem;">voltar</span></div>
      <div class="pad">
        <div class="item">
        <div>
        <strong>Lab 1 11:00-12:00</strong>
        <div>
        <span class="badge bad">ocupado</span>
        </div>
        </div>
        </div>
        <div class="aviso erro">Conflito de horario — escolha outro slot</div>
        <div class="item">
        <div>
        <strong>Lab 2 10:00-11:00</strong>
        <div>
        <span class="badge ok">livre</span>
        </div>
        </div>
        <button class="btn main" style="width:auto;padding:6px 10px;margin:0;font-size:0.75rem;">Reservar</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
